plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.ytzero'
version = '0.1.0'

android {
  namespace "app.ytzero.pictureinpicture"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Gradle uses the app's newer copy; this only puts the PiP listener API on the classpath.
  implementation 'androidx.activity:activity:1.8.0'
}
