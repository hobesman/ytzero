plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.ytzero'
version = '0.1.0'

android {
  namespace "app.ytzero.musicplayer"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
}

dependencies {
  // The same Media3 release expo-video uses, so the app carries one copy.
  def media3Version = "1.9.0"
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-session:${media3Version}"

  // Unit tests run on the JVM, where Android's org.json is only a stub.
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20240303"
  // Device tests talk to the service as Android Auto does (connectedDebugAndroidTest).
  androidTestImplementation "androidx.test:runner:1.6.2"
  androidTestImplementation "androidx.test:core:1.6.1"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
